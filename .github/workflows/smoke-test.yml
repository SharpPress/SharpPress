name: Smoke test

on:
  workflow_dispatch:
    inputs:
      keep_running:
        description: 'Keep the instance alive until you cancel the run'
        type: boolean
        default: false
      auto_setup:
        description: 'Create the admin account automatically so every page gets checked'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sharppress
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Build
        run: dotnet build Server/SharpPress.csproj -c Release --nologo

      - name: Write config
        working-directory: Server
        run: |
          cat > config.json <<'EOF'
          {
            "SetupStep": 2,
            "MySQL_Config": {
              "host": "127.0.0.1",
              "port": 3306,
              "database_name": "sharppress",
              "database_username": "root",
              "database_password": "root"
            }
          }
          EOF

      - name: Start server
        working-directory: Server
        run: |
          HTTP_PORT=8080 nohup dotnet bin/Release/net8.0/SharpPress.dll > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for healthy
        working-directory: Server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          exit 1

      - name: Smoke checks
        env:
          AUTO_SETUP: ${{ inputs.auto_setup }}
        run: |
          check() {
            result=$(curl -sL -o /tmp/body -w "%{http_code} %{url_effective}" "http://127.0.0.1:8080$1")
            code=${result%% *}
            eff=${result#* }
            if [ "$code" != "200" ] || [ "$eff" != "http://127.0.0.1:8080$1" ]; then
              echo "$1 ended at $eff ($code)"
              exit 1
            fi
            if [ -n "$2" ] && ! grep -qi "$2" /tmp/body; then
              echo "$1 did not contain '$2'"
              exit 1
            fi
            echo "ok $1"
          }

          check /health Healthy
          check /setup

          if [ "$AUTO_SETUP" != "true" ]; then
            loc=$(curl -s -o /dev/null -w "%{redirect_url}" http://127.0.0.1:8080/Login)
            if ! echo "$loc" | grep -q "/setup"; then
              echo "expected /Login to redirect to /setup on a fresh install, got '$loc'"
              exit 1
            fi
            echo "ok /Login redirects to /setup"
            exit 0
          fi

          curl -s -c /tmp/jar http://127.0.0.1:8080/setup -o /tmp/setup.html
          token=$(grep '__RequestVerificationToken' /tmp/setup.html | grep -oE 'value="[^"]+"' | head -1 | cut -d'"' -f2)

          code=$(curl -s -b /tmp/jar -o /tmp/done.html -w "%{http_code}" \
            --data-urlencode "Step2.SiteName=SharpPress" \
            --data-urlencode "Step2.SiteDescription=ci run" \
            --data-urlencode "Step2.Username=admin" \
            --data-urlencode "Step2.Email=admin@example.com" \
            --data-urlencode "Step2.Password=Admin123!x" \
            --data-urlencode "Step2.ConfirmPassword=Admin123!x" \
            --data-urlencode "__RequestVerificationToken=$token" \
            "http://127.0.0.1:8080/setup?handler=Step2")
          if [ "$code" != "302" ]; then
            echo "setup step 2 returned $code"
            cat /tmp/done.html
            exit 1
          fi
          echo "ok setup step 2"

          code=$(curl -s -b /tmp/jar -o /tmp/done.html -w "%{http_code}" \
            --data-urlencode "Step3.SiteUrl=http://127.0.0.1:8080" \
            --data-urlencode "Step3.Timezone=UTC" \
            --data-urlencode "Step3.AllowRegistration=false" \
            --data-urlencode "Step3.ForceHttps=false" \
            --data-urlencode "__RequestVerificationToken=$token" \
            "http://127.0.0.1:8080/setup?handler=Step3")
          if [ "$code" != "302" ]; then
            echo "setup step 3 returned $code"
            cat /tmp/done.html
            exit 1
          fi
          echo "ok setup step 3"

          check /Login
          check /rss.xml "<rss"
          check /sitemap.xml "<urlset"
          check /robots.txt "127.0.0.1:8080"

      - name: Server log
        if: always()
        working-directory: Server
        run: cat server.log

      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: |
            Server/server.log
            Server/tunnel.log
            Server/ngrok.log
            Server/cloudflared.log
          if-no-files-found: ignore

      - name: Start public tunnel
        if: ${{ inputs.keep_running }}
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ vars.NGROK_DOMAIN }}
        working-directory: Server
        run: |
          url=""

          if [ -n "$NGROK_AUTHTOKEN" ]; then
            curl -sL -o ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
            unzip -q ngrok.zip
            nohup ./ngrok http 8080 --log stdout --authtoken "$NGROK_AUTHTOKEN" ${NGROK_DOMAIN:+--domain=$NGROK_DOMAIN} > ngrok.log 2>&1 &
            for i in $(seq 1 30); do
              url=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -oE '"public_url":"https://[^"]+"' | cut -d'"' -f4 | head -1)
              if [ -n "$url" ]; then break; fi
              sleep 2
            done
          fi

          if [ -z "$url" ]; then
            curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x cloudflared
            nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > cloudflared.log 2>&1 &
            for i in $(seq 1 30); do
              url=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1)
              if [ -n "$url" ]; then break; fi
              sleep 2
            done
          fi

          if [ -z "$url" ]; then
            nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:127.0.0.1:8080 a@free.pinggy.io > tunnel.log 2>&1 &
            for i in $(seq 1 30); do
              url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.(pinggy\.net|pinggy-free\.link|pinggy\.io)' tunnel.log | grep -v 'dashboard\.pinggy' | head -1)
              if [ -n "$url" ]; then break; fi
              sleep 2
            done
          fi

          if [ -z "$url" ]; then
            echo "no tunnel came up"
            cat ngrok.log tunnel.log 2>/dev/null
            exit 1
          fi

          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" > tunnel.url
          echo "public url: $url"

      - name: Keep running until cancelled
        if: ${{ inputs.keep_running }}
        working-directory: Server
        run: |
          echo "open the url from the step summary, cancel this run when you are done"
          (
            while true; do
              local_time=$(curl -s -o /dev/null -m 130 -w "%{time_total}" http://127.0.0.1:8080/nonexistent)
              tunnel_time=$(curl -s -o /dev/null -m 130 -w "%{time_total}" "$(cat tunnel.url)/nonexistent")
              local_post=$(curl -s -o /dev/null -m 130 -X POST -d "probe=1" -w "%{time_total}" http://127.0.0.1:8080/nonexistent)
              tunnel_post=$(curl -s -o /dev/null -m 130 -X POST -d "probe=1" -w "%{time_total}" "$(cat tunnel.url)/nonexistent")
              echo "[probe] GET direct=${local_time}s tunnel=${tunnel_time}s | POST direct=${local_post}s tunnel=${tunnel_post}s"
              sleep 15
            done
          ) &
          tail -f server.log
