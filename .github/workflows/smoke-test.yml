name: Smoke test

on:
  workflow_dispatch:
    inputs:
      keep_running:
        description: 'Keep the instance alive until you cancel the run'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sharppress
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Build
        run: dotnet build Server/SharpPress.csproj -c Release --nologo

      - name: Write config
        working-directory: Server
        run: |
          cat > config.json <<'EOF'
          {
            "MySQL_Config": {
              "host": "127.0.0.1",
              "port": 3306,
              "database_name": "sharppress",
              "database_username": "root",
              "database_password": "root"
            }
          }
          EOF

      - name: Start server
        working-directory: Server
        run: |
          HTTP_PORT=8080 nohup dotnet bin/Release/net8.0/SharpPress.dll > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for healthy
        working-directory: Server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          exit 1

      - name: Smoke checks
        run: |
          check() {
            curl -sf "http://127.0.0.1:8080$1" > /tmp/body || { echo "$1 did not answer"; exit 1; }
            if [ -n "$2" ] && ! grep -qi "$2" /tmp/body; then
              echo "$1 did not contain '$2'"
              exit 1
            fi
            echo "ok $1"
          }
          check /health Healthy
          check /setup
          check /Login
          check /rss.xml "<rss"
          check /sitemap.xml "<urlset"
          check /robots.txt sitemap

      - name: Server log
        if: always()
        working-directory: Server
        run: cat server.log

      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: |
            Server/server.log
            Server/tunnel.log
            Server/ngrok.log
          if-no-files-found: ignore

      - name: Start public tunnel
        if: ${{ inputs.keep_running }}
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ vars.NGROK_DOMAIN }}
        working-directory: Server
        run: |
          url=""

          if [ -n "$NGROK_AUTHTOKEN" ]; then
            curl -sL -o ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
            unzip -q ngrok.zip
            nohup ./ngrok http 8080 --log stdout --authtoken "$NGROK_AUTHTOKEN" ${NGROK_DOMAIN:+--domain=$NGROK_DOMAIN} > ngrok.log 2>&1 &
            for i in $(seq 1 30); do
              url=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -oE '"public_url":"https://[^"]+"' | cut -d'"' -f4 | head -1)
              if [ -n "$url" ]; then break; fi
              sleep 2
            done
          fi

          if [ -z "$url" ]; then
            nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:127.0.0.1:8080 a@free.pinggy.io > tunnel.log 2>&1 &
            for i in $(seq 1 30); do
              url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.(pinggy\.net|pinggy-free\.link|pinggy\.io)' tunnel.log | grep -v 'dashboard\.pinggy' | head -1)
              if [ -n "$url" ]; then break; fi
              sleep 2
            done
          fi

          if [ -z "$url" ]; then
            echo "no tunnel came up"
            cat ngrok.log tunnel.log 2>/dev/null
            exit 1
          fi

          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "public url: $url"

      - name: Keep running until cancelled
        if: ${{ inputs.keep_running }}
        working-directory: Server
        run: |
          echo "open the url from the step summary, cancel this run when you are done"
          tail -f server.log
